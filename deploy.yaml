name: Build Docker and Deploy to AKS

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Log in to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/node-web-app:${{ github.sha }}

    - name: Set up Kubectl
      uses: azure/setup-kubectl@v3

    - name: Set AKS Context
      uses: azure/aks-set-context@v3
      with:
        resource-group: 'test'
        cluster-name: 'test'

    - name: Update Kubernetes deployment image
      run: |
        # Replace placeholder with actual tagged image
        sed -i 's|__IMAGE_NAME__|${{ secrets.ACR_LOGIN_SERVER }}/node-web-app:${{ github.sha }}|g' k8s/app-deployment.yaml
        kubectl apply -f k8s/app-deployment.yaml
